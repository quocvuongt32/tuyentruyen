backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

# Chỉ tài khoản được mời qua Netlify Identity (Invite only) mới đăng nhập được.
# Xem README.md để bật Identity + Git Gateway và giới hạn theo email/GitHub của bạn.

collections:
  - name: "site"
    label: "Nội dung chung trang web"
    files:
      - name: "cai_dat"
        label: "Header, Trang chủ, Footer"
        file: "content/site.json"
        fields:
          - label: "Tên thương hiệu (góc trên bên trái)"
            name: "brand"
            widget: "object"
            fields:
              - { label: "Dòng 1", name: "line1", widget: "string" }
              - { label: "Dòng 2 (màu vàng)", name: "line2", widget: "string" }

          - label: "Nhãn menu điều hướng"
            name: "nav"
            widget: "object"
            fields:
              - { label: "Trang chủ", name: "trangChu", widget: "string" }
              - { label: "Giới thiệu", name: "gioiThieu", widget: "string" }
              - { label: "Tuyên truyền", name: "tuyenTruyen", widget: "string" }
              - { label: "Hoạt động khác", name: "hoatDongKhac", widget: "string" }
              - { label: "Liên hệ", name: "lienHe", widget: "string" }

          - label: "Khối đầu trang (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Tiêu đề lớn", name: "title", widget: "string" }
              - label: "Đoạn mô tả"
                name: "subtitle"
                widget: "text"
                hint: "Nhấn Enter ở đâu thì trang sẽ xuống dòng đúng ở đó — tự chủ động ngắt dòng cho đẹp, không để trình duyệt tự ngắt."
              - { label: "Nút bấm (chữ)", name: "ctaText", widget: "string" }

          - label: "Mục Tuyên truyền An ninh mạng"
            name: "timelineSection"
            widget: "object"
            fields:
              - { label: "Tiêu đề mục", name: "heading", widget: "string" }
              - { label: "Gợi ý dưới tiêu đề", name: "hint", widget: "string" }

          - label: "Mục Hoạt động khác"
            name: "activitySection"
            widget: "object"
            fields:
              - { label: "Tiêu đề mục", name: "heading", widget: "string" }
              - { label: "Gợi ý dưới tiêu đề", name: "hint", widget: "string" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Dòng 1 (tên Học viện)", name: "line1", widget: "string" }
              - { label: "Dòng 2 (tên Khoa)", name: "line2", widget: "string" }

  - name: "gioi_thieu"
    label: "Giới thiệu (trang chủ)"
    files:
      - name: "noi_dung"
        label: "Nội dung mục Giới thiệu"
        file: "content/gioi-thieu.json"
        fields:
          - label: "Tiêu đề mục"
            name: "heading"
            widget: "string"
            default: "Giới thiệu"

          - label: "Đoạn giới thiệu"
            name: "intro"
            widget: "text"

          - label: "Đối tác / chỉ đạo (khung phải, có thể thêm/bớt)"
            name: "partners"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - label: "Huy hiệu / icon"
                name: "icon"
                widget: "image"
              - label: "Nội dung"
                name: "text"
                widget: "string"

          - label: "Điểm nổi bật (3 thẻ, có thể thêm/bớt)"
            name: "points"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                default: "shield"
                options:
                  - { label: "Khiên (an ninh mạng)", value: "shield" }
                  - { label: "Bóng đèn (đổi mới sáng tạo)", value: "bulb" }
                  - { label: "Làm mới (chuyển đổi số)", value: "refresh" }
                  - { label: "Tài liệu", value: "doc" }
                  - { label: "Máy tính", value: "computer" }
                  - { label: "Ngôi sao", value: "star" }
              - label: "Nội dung"
                name: "text"
                widget: "string"

          - label: "Tiêu đề khối căn cứ thực hiện"
            name: "directiveTitle"
            widget: "string"
            default: "Căn cứ thực hiện"

          - label: "Căn cứ thực hiện (có thể thêm/bớt)"
            name: "directives"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Tên văn bản"
                name: "title"
                widget: "string"
              - label: "Ngày ban hành"
                name: "date"
                widget: "string"
              - label: "Nội dung"
                name: "description"
                widget: "text"

  - name: "events"
    label: "Hoạt động"
    label_singular: "Hoạt động"
    folder: "content/events"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    identifier_field: "title"
    summary: "{{date}} — [{{category}}] {{title}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - label: "Tiêu đề hoạt động"
        name: "title"
        widget: "string"
        required: true

      - label: "Phân loại"
        name: "category"
        widget: "select"
        required: true
        options:
          - { label: "An ninh mạng", value: "an-ninh-mang" }
          - { label: "Chuyển đổi số", value: "chuyen-doi-so" }
          - { label: "Đổi mới sáng tạo", value: "doi-moi-sang-tao" }
          - { label: "Nghiên cứu khoa học", value: "nghien-cuu-khoa-hoc" }
          - { label: "Khác", value: "khac" }

      - label: "Thời gian"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: true

      - label: "Địa điểm"
        name: "location"
        widget: "string"
        required: true

      - label: "Nội dung tóm tắt"
        name: "body"
        widget: "markdown"
        required: false
        minimal: true
        buttons: ["bold", "italic", "link", "bulleted-list", "heading-two"]

      - label: "Link video (YouTube hoặc Google Drive, chia sẻ công khai)"
        name: "video"
        widget: "string"
        required: false
        hint: "Dán link xem video (vd: https://youtu.be/... hoặc link chia sẻ Google Drive)"
        pattern: ['^(https?:\/\/).+$', "Link phải bắt đầu bằng http:// hoặc https://"]

      - label: "Ảnh minh chứng"
        name: "images"
        widget: "list"
        required: false
        allow_add: true
        hint: "Có thể chọn/kéo-thả NHIỀU ảnh cùng lúc để thêm 1 lần. Nén mỗi ảnh xuống dưới 1MB trước khi tải lên (vd: giảm chiều ngang còn ~1600px), nếu không sẽ báo lỗi 'Failed to persist entry' khi lưu."
        field:
          label: "Ảnh"
          name: "image"
          widget: "image"

      - label: "Ảnh đại diện nổi bật (hiển thị ở banner trang chủ)"
        name: "featuredImage"
        widget: "image"
        required: false
        hint: "Không bắt buộc — chỉ chọn nếu muốn ảnh này của hoạt động này xuất hiện trong banner trượt ở trang chủ."

      - label: "Link bài viết tham khảo"
        name: "link"
        widget: "string"
        required: false
        pattern: ['^(https?:\/\/).+$', "Link phải bắt đầu bằng http:// hoặc https://"]

  - name: "ticker"
    label: "Tin liên quan (dải chạy đầu trang)"
    label_singular: "Tin liên quan"
    folder: "content/ticker"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    identifier_field: "title"
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: "Tiêu đề tin (hiển thị trên dải chạy)"
        name: "title"
        widget: "string"
        required: true

      - label: "Link bài viết gốc"
        name: "url"
        widget: "string"
        required: true
        hint: "Dán link bài viết trên trang chính thống (Học viện CSND, báo Đảng, Bộ Công an...)"
        pattern: ['^(https?:\/\/).+$', "Link phải bắt đầu bằng http:// hoặc https://"]

      - label: "Nguồn tin"
        name: "source"
        widget: "string"
        required: true
        hint: "Vd: Học viện CSND, Báo điện tử Đảng Cộng sản Việt Nam..."

      - label: "Ngày đăng"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: true
