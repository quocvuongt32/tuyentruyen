name: Sao lưu nội dung

on:
  schedule:
    - cron: "15 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Đóng gói nội dung và ảnh
        run: tar -czf tuyentruyen-content-${GITHUB_RUN_ID}.tar.gz content uploads img

      - name: Lưu bản sao 90 ngày
        uses: actions/upload-artifact@v4
        with:
          name: tuyentruyen-content-${{ github.run_id }}
          path: tuyentruyen-content-${{ github.run_id }}.tar.gz
          retention-days: 90
          if-no-files-found: error
