[build]
  command = "node scripts/build-public.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Trang public: chính sách bảo mật chặt (không CDN, không script ngoài).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; upgrade-insecure-requests"

# --- Cache anh de giam bang thong (nguyen nhan chinh gay het credit Netlify) ---
# Mac dinh Netlify tra "max-age=0, must-revalidate" cho file tinh -> moi khach
# quay lai van tai lai TOAN BO anh. Dat max-age dai cho anh (noi dung on dinh,
# ten file gan nhu khong bao gio doi) de trinh duyet + CDN giu cache, khong tai
# lai. Neu co doi anh trung ten qua /admin: khach da cache se thay ban cu toi
# ~7 ngay (uploads) hoac ~30 ngay (img) roi tu cap nhat - chap nhan duoc voi
# tan suat doi anh cua du an. stale-while-revalidate cho phep tra ngay ban
# cache trong luc kiem tra ban moi o nen. Xem docs/DEPLOYMENT.md.
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
