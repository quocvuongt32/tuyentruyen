backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

# Chỉ tài khoản được mời qua Netlify Identity (Invite only) mới đăng nhập được.
# Xem README.md để bật Identity + Git Gateway và giới hạn theo email/GitHub của bạn.

collections:
  - name: "gioi_thieu"
    label: "Giới thiệu (trang chủ)"
    files:
      - name: "noi_dung"
        label: "Nội dung mục Giới thiệu"
        file: "content/gioi-thieu.json"
        fields:
          - label: "Tiêu đề mục"
            name: "heading"
            widget: "string"
            default: "Giới thiệu"

          - label: "Đoạn giới thiệu"
            name: "intro"
            widget: "text"

          - label: "Đối tác / chỉ đạo (khung phải, có thể thêm/bớt)"
            name: "partners"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - label: "Huy hiệu / icon"
                name: "icon"
                widget: "image"
              - label: "Nội dung"
                name: "text"
                widget: "string"

          - label: "Điểm nổi bật (3 thẻ, có thể thêm/bớt)"
            name: "points"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                default: "shield"
                options:
                  - { label: "Khiên (an ninh mạng)", value: "shield" }
                  - { label: "Bóng đèn (đổi mới sáng tạo)", value: "bulb" }
                  - { label: "Làm mới (chuyển đổi số)", value: "refresh" }
                  - { label: "Tài liệu", value: "doc" }
                  - { label: "Máy tính", value: "computer" }
                  - { label: "Ngôi sao", value: "star" }
              - label: "Nội dung"
                name: "text"
                widget: "string"

          - label: "Tiêu đề khối căn cứ thực hiện"
            name: "directiveTitle"
            widget: "string"
            default: "Căn cứ thực hiện"

          - label: "Căn cứ thực hiện (có thể thêm/bớt)"
            name: "directives"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Tên văn bản"
                name: "title"
                widget: "string"
              - label: "Ngày ban hành"
                name: "date"
                widget: "string"
              - label: "Nội dung"
                name: "description"
                widget: "text"

  - name: "events"
    label: "Hoạt động"
    label_singular: "Hoạt động"
    folder: "content/events"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    identifier_field: "title"
    summary: "{{date}} — [{{category}}] {{title}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - label: "Tiêu đề hoạt động"
        name: "title"
        widget: "string"
        required: true

      - label: "Phân loại"
        name: "category"
        widget: "select"
        required: true
        options:
          - { label: "An ninh mạng", value: "an-ninh-mang" }
          - { label: "Chuyển đổi số", value: "chuyen-doi-so" }
          - { label: "Đổi mới sáng tạo", value: "doi-moi-sang-tao" }
          - { label: "Nghiên cứu khoa học", value: "nghien-cuu-khoa-hoc" }
          - { label: "Khác", value: "khac" }

      - label: "Thời gian"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: true

      - label: "Địa điểm"
        name: "location"
        widget: "string"
        required: true

      - label: "Nội dung tóm tắt"
        name: "body"
        widget: "markdown"
        required: false
        minimal: true
        buttons: ["bold", "italic", "link", "bulleted-list", "heading-two"]

      - label: "Link video (YouTube hoặc Google Drive, chia sẻ công khai)"
        name: "video"
        widget: "string"
        required: false
        hint: "Dán link xem video (vd: https://youtu.be/... hoặc link chia sẻ Google Drive)"
        pattern: ['^(https?:\/\/).+$', "Link phải bắt đầu bằng http:// hoặc https://"]

      - label: "Ảnh minh chứng"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.image}}"
        fields:
          - label: "Ảnh"
            name: "image"
            widget: "image"
          - label: "Đánh dấu là ảnh nổi bật (hiển thị ở banner trang chủ)"
            name: "featured"
            widget: "boolean"
            default: false
            required: false

      - label: "Link bài viết tham khảo"
        name: "link"
        widget: "string"
        required: false
        pattern: ['^(https?:\/\/).+$', "Link phải bắt đầu bằng http:// hoặc https://"]

  - name: "ticker"
    label: "Tin liên quan (dải chạy đầu trang)"
    label_singular: "Tin liên quan"
    folder: "content/ticker"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    identifier_field: "title"
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: "Tiêu đề tin (hiển thị trên dải chạy)"
        name: "title"
        widget: "string"
        required: true

      - label: "Link bài viết gốc"
        name: "url"
        widget: "string"
        required: true
        hint: "Dán link bài viết trên trang chính thống (Học viện CSND, báo Đảng, Bộ Công an...)"
        pattern: ['^(https?:\/\/).+$', "Link phải bắt đầu bằng http:// hoặc https://"]

      - label: "Nguồn tin"
        name: "source"
        widget: "string"
        required: true
        hint: "Vd: Học viện CSND, Báo điện tử Đảng Cộng sản Việt Nam..."

      - label: "Ngày đăng"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: true
